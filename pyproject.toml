[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wasel-cli"
version = "1.0.0"
description = "Wasel — a free-LLM AI agent for your terminal (Termux friendly, zero dependencies)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["ai", "agent", "cli", "llm", "free", "termux", "openrouter", "gemini", "groq"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.scripts]
wasel = "wasel.cli:main"

[tool.setuptools]
packages = ["wasel"]
